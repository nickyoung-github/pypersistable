

[project]
name = "pypersistable"
description = "Persistable Python Object Model"
authors = [
    {name = "Nick Young", email = "nick.young.github@gmail.com"}
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13"

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    "Operating System :: OS Independent"
]

dynamic = ["version"]

dependencies = [
    "duckdb",
    "fsspec",
    "orjson",
    "pyarrow",
    "pydantic>2.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov"
]

[project.urls]
homepage = "https://github.com/nickyoung-github/pypersistable"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "src/pypersistable/_version.py"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "ruff>=0.17.5",
]

[tool.pyright]
include = ["src", "tests", "examples"]

[tool.coverage.run]
source = ["pypersistable"]
branch = true
omit = ["*/_version.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 97
