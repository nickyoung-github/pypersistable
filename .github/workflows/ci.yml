name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Each OS and version runs to completion, though another fails
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    # SQLStore is tested on SQLite only: set PYPERSISTABLE_TEST_POSTGRES_URL to also test it on PostgreSQL
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the tags
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra test
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest --cov
